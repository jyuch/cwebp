[package]
name = "cwebp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1", features = ["backtrace", "std"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", features = ["webp"] }
walkdir = "2"
indicatif = "0.18"

# Windows‑specific dependency with required feature
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
